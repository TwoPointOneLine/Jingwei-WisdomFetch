[project]
name = "jingwei-knowledge"
version = "0.1.0"
description = "精卫 - 知识库导入服务（独立可部署模块）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "pymilvus>=2.4.0",
    "pymupdf>=1.24.0",
    "pymongo>=4.8.0",
    "minio>=7.2.0",
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.3.0",
    "jingwei-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jingwei_knowledge"]

[tool.uv.sources]
jingwei-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
