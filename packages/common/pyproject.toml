[project]
name = "shopkeeper-common"
version = "0.1.0"
description = "掌柜智库公共模块：基础配置、常量、通用工具、日志、SSE/任务、基础客户端、LLM 封装、统一契约"
readme = "README.md"
requires-python = ">=3.11"
# 依赖约束与根 pyproject 对齐（>= 无上限），避免 workspace 合并解析时降级现有依赖
dependencies = [
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pymilvus>=2.4.0",
    "pymongo>=4.8.0",
    "minio>=7.2.0",
    "langchain-openai>=0.2.0",
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.3.0",
    "sse-starlette>=2.1.0",
    "starlette>=0.37.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopkeeper_common"]

# 提示词等资源文件随 wheel 分发
[tool.hatch.build.targets.wheel.force-include]
"src/shopkeeper_common/resources" = "shopkeeper_common/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
