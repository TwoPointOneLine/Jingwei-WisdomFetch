# ============================================================
# 掌柜智库 (Shopkeeper Think Tank) 基础设施编排
# 启动： docker compose -f deploy/docker-compose.yml up -d
# 停止： docker compose -f deploy/docker-compose.yml down
# 查看： docker compose -f deploy/docker-compose.yml ps
# ============================================================

name: shopkeeper-think-tank

networks:
  shopkeeper:
    driver: bridge

volumes:
  etcd-data:
  milvus-data:
  mongo-data:
  minio-data:

services:
  # ---------------------- etcd（Milvus 依赖） ----------------------
  etcd:
    container_name: shopkeeper-think-tank-etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopkeeper

  # ---------------------- MinIO（Milvus 内部对象存储） ----------------------
  # 注意端口与下方「外部对象存储 MinIO」错开，避免冲突
  milvus-minio:
    container_name: shopkeeper-think-tank-milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-data:/minio_data
    command: minio server /minio_data --address :9200 --console-address :9201
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopkeeper

  # ---------------------- Milvus standalone ----------------------
  milvus:
    container_name: shopkeeper-think-tank-milvus
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9200
    volumes:
      - milvus-data:/minio_data
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    networks:
      - shopkeeper

  # ---------------------- MongoDB（聊天历史 / 任务状态持久化） ----------------------
  mongo:
    container_name: shopkeeper-think-tank-mongo
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-shopkeeper123}
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      start_period: 30s
      timeout: 10s
      retries: 3
    networks:
      - shopkeeper

  # ---------------------- MinIO（外部对象存储：PDF/Markdown 原文） ----------------------
  # 与 Milvus 内部 MinIO 端口错开（9000 API / 9001 Console）
  object-storage:
    container_name: shopkeeper-think-tank-object-storage
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-shopkeeper}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-shopkeeper123}
    volumes:
      - minio-data:/data
    command: minio server /data --address :9000 --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shopkeeper

  # ---------------------- Attu（Milvus Web 管理台，可选） ----------------------
  attu:
    container_name: shopkeeper-think-tank-attu
    image: zilliz/attu:v2.4.3
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      - milvus
    networks:
      - shopkeeper
