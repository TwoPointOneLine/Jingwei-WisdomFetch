# ============================================================
# 精卫 (Jingwei WisdomFetch) —— 仓库根 pyproject.toml
# ------------------------------------------------------------
# 本文件为「仓库级（monorepo 根）」标记，仅承载项目元信息，
# 不参与 Python 依赖/构建管理。
#
# - Python 工程的 uv workspace 根在 backend/pyproject.toml
#   （其 [tool.uv.workspace] 成员为 backend/packages/*、backend/services/*）。
# - 为避免与 backend 的 uv workspace 冲突，本文件【不】声明
#   [tool.uv.workspace]、[build-system] 或任何依赖，仅作根标识。
#
# 子工程入口：
#   - 后端（uv workspace）：backend/
#   - 前端（pnpm）：        frontend/
#   - 部署编排：            deploy/
# ============================================================

[project]
name = "jingwei-wisdomfetch"
version = "0.1.0"
description = "精卫 · 金融智能知识库（Jingwei WisdomFetch, JWF）—— 企业级私有金融知识库智能问答系统（RAG）。仓库根：含 backend(Python) + frontend(React) + deploy(Docker)。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# 明确不在此声明 uv workspace，保持 backend/ 为唯一的 Python 工程根。
# 若后续需要根级统一脚本，可在此添加 [project.scripts]，但勿加 [tool.uv.workspace]。
